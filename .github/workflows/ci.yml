name: CI

# Push only, on every branch: checks attach to the commit, so a pull request
# shows them anyway without paying for a second run. Add pull_request when
# outside contributors appear.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

# A newer push to the same branch makes the running check pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  etl:
    name: ETL image and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # layer cache in GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image is 4.4GB and gets loaded into the local daemon to run the
      # tests. The hosted runner ships toolchains this job never touches.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry cache, not the Actions cache: the torch layer alone would eat
      # most of the 10GB Actions cache quota. A failed cache write only makes
      # the next build slower, so it must not fail this one.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          load: true
          tags: syndra-etl:ci
          cache-from: type=registry,ref=ghcr.io/fransmm/syndra-etl:buildcache
          cache-to: type=registry,ref=ghcr.io/fransmm/syndra-etl:buildcache,mode=max,ignore-error=true

      # Tests run inside the image that would be deployed, with no network and
      # throwaway credentials. test_security.py needs Postgres and Redis and has
      # its own stack (run-integration-tests.sh).
      - name: Unit tests
        run: |
          docker run --rm --network none \
            -e POSTGRES_USER=ci -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=ci \
            -v "$PWD/backend/tests:/code/tests:ro" \
            -v "$PWD/backend/pytest.ini:/code/pytest.ini:ro" \
            syndra-etl:ci \
            python -m pytest /code/tests --ignore=/code/tests/test_security.py -q -p no:cacheprovider

  demo:
    name: Demo image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: demo
          push: false
