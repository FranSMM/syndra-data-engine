name: syndra-data-engine

services:
  postgres:
    image: postgres:15-alpine
    container_name: syndra_postgres
    restart: unless-stopped
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./infra/postgres-init.sh:/docker-entrypoint-initdb.d/postgres-init.sh
    env_file:
      - .env
    ports:
      - "5433:5432"
    healthcheck:
      # Checks if the DB is ready to accept connections
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.17.0
    container_name: syndra_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: syndra_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data

  api:
    build: ./backend
    container_name: syndra_api
    restart: unless-stopped
    # Hot reload is a local-development concern, not a property of the image.
    # The Dockerfile CMD stays production-safe; this override adds --reload on
    # top of the bind-mounted ./backend/app below.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend/app:/code/app
      - ./backend/tests:/code/tests
      - ./backend/alembic:/code/alembic
      - ./backend/alembic.ini:/code/alembic.ini
      # pytest.ini carries asyncio_mode=auto; without it the suite runs in
      # strict mode inside the container and every unmarked async test errors.
      - ./backend/pytest.ini:/code/pytest.ini
      # Cache for ML models (downloaded once, persists across restarts)
      - ./data/huggingface:/root/.cache/huggingface
    
    # GPU Configuration (only works on Docker Desktop with NVIDIA drivers)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started

  prefect_server:
    image: prefecthq/prefect:3-latest
    container_name: syndra_prefect_server
    command: ["prefect", "server", "start", "--host", "0.0.0.0", "--port", "4200"]
    env_file:
      - .env
    environment:
      - PREFECT_API_URL=http://127.0.0.1:4200/api
    ports:
      - "4200:4200"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  scheduler:
    build: ./backend
    container_name: syndra_scheduler
    env_file:
      - .env
    environment:
      - PREFECT_API_URL=http://prefect_server:4200/api
    command: ["python", "-m", "app.pipeline"]
    restart: unless-stopped
    volumes:
      - ./backend/app:/code/app
      - ./data/huggingface:/root/.cache/huggingface
    
    # GPU Configuration
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      postgres:
        condition: service_healthy
      prefect_server:
        condition: service_started
      qdrant:
        condition: service_started
