services:
  db:
    image: postgres:15-alpine
    restart: always
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    env_file:
      - .env
    ports:
      - "5432:5432"

  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    ports:
      - "6333:6333" # Puerto de la API REST de Qdrant
    volumes:
      - ./data/qdrant:/qdrant/storage

  backend:
    build: ./backend
    volumes:
      - ./backend/app:/code/app  # Hot-reloading
      - ./backend/alembic:/code/alembic  # Sincroniza migraciones generadas
      - ./backend/alembic.ini:/code/alembic.ini
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - qdrant # El backend ahora espera a la DB relacional y a la vectorial
