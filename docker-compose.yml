name: syndra-data-engine

services:
  db:
    image: postgres:15-alpine
    restart: always
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./infra/postgres-init.sh:/docker-entrypoint-initdb.d/postgres-init.sh
    env_file:
      - .env
    ports:
      - "5433:5432"
    healthcheck:
      # Checks if the DB is ready to accept connections
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.17.0
    container_name: syndra_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage

  backend:
    build: ./backend
    container_name: syndra_backend
    # Restarts the container if it crashes
    restart: unless-stopped
    volumes:
      - ./backend/app:/code/app
      - ./backend/alembic:/code/alembic
      - ./backend/alembic.ini:/code/alembic.ini
      # Cache for ML models (downloaded once, persists across restarts)
      - ./data/huggingface:/root/.cache/huggingface
    
    # GPU Configuration (only works on Docker Desktop with NVIDIA drivers)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
