version: "3.8"

services:
  db:
    image: postgres:15-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    ports:
      - "5432:5432"

  # NUEVO: Base de datos vectorial para los modelos de IA (Fase 2)
  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    ports:
      - "6333:6333" # Puerto de la API REST de Qdrant
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build: ./backend
    volumes:
      - ./backend/app:/code/app  # Hot-reloading
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - qdrant # El backend ahora espera a la DB relacional y a la vectorial

volumes:
  postgres_data:
  qdrant_data: # Añadimos el volumen para que los vectores de IA no se borren