name: syndra-data-engine

# Docker's json-file driver keeps every line a container ever wrote, with no
# limit by default. With an hourly pipeline and a per-request API log that is a
# disk that fills itself in silence, and the failure surfaces months later as
# Postgres unable to write. Capping at 3 files of 10MB bounds each container to
# 30MB. Rotation discards history, which is the right trade here: container
# logs are immediate diagnosis, while the history that matters lives in
# Postgres, in docs/troubleshooting and in Prefect.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:15-alpine
    container_name: syndra_postgres
    logging: *default-logging
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - syndra_pgdata:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/postgres-init.sh
    networks:
      - syndra_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.17.0
    container_name: syndra_qdrant
    logging: *default-logging
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - syndra_qdrant_data:/qdrant/storage
    networks:
      - syndra_net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: syndra_redis
    logging: *default-logging
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - syndra_net
    restart: unless-stopped
    volumes:
      - syndra_redis_data:/data

  api:
    # Pinned to the git SHA that built it, written into the VPS .env by
    # deploy.sh. :latest is a mutable tag with no history behind it, so it can
    # never be rolled back to; a SHA can. The :-latest default keeps compose
    # resolving to something valid if the variable is ever missing, rather than
    # failing on an empty image name.
    image: ghcr.io/fransmm/syndra-etl:${ETL_TAG:-latest}
    container_name: syndra_api
    logging: *default-logging
    # No host ports — Caddy is the only ingress. API is reachable
    # only via Docker's internal syndra_net network.
    env_file: .env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    networks:
      - syndra_net
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    deploy:
      resources:
        limits:
          # Sized from measurement, in two steps. At 512M the cgroup had hit its
          # ceiling 12833 times with one recorded oom_kill; the 314MB the
          # container appeared to use was not its appetite but its footprint
          # compressed by constant reclaim. Raising it to 768M revealed the real
          # figure: 789MB of anonymous memory, 395MB + 394MB across the two
          # uvicorn workers, each of which imports torch and
          # sentence-transformers at module load — roughly 390MB before any
          # model weights exist. /search/semantic then adds a MiniLM copy per
          # worker on first use.
          #
          # 1.25G covers both workers with their models resident and leaves
          # headroom. The box is dedicated to this project and was using 1.5G of
          # 3.8G, so the room was there.
          #
          # The cheaper fix is one worker instead of two: the API is async, its
          # only CPU-bound work (embedding) already runs in a threadpool via
          # asyncio.to_thread, and two workers on a 2-vCPU box that also runs
          # FinBERT inference contend for CPU while duplicating the same weights
          # in RAM. Left at two deliberately, not by omission.
          memory: 1.25G

  prefect_server:
    image: prefecthq/prefect:3-latest
    container_name: syndra_prefect_server
    logging: *default-logging
    command: ["prefect", "server", "start", "--host", "0.0.0.0", "--port", "4200"]
    env_file: .env
    environment:
      - PREFECT_API_URL=http://127.0.0.1:4200/api
    ports:
      - "127.0.0.1:4200:4200"
    networks:
      - syndra_net
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  scheduler:
    # Same image and therefore the same tag as the API: they are one build.
    image: ghcr.io/fransmm/syndra-etl:${ETL_TAG:-latest}
    container_name: syndra_scheduler
    logging: *default-logging
    env_file: .env
    environment:
      - PREFECT_API_URL=http://prefect_server:4200/api
    command: ["python", "-m", "app.pipeline"]
    networks:
      - syndra_net
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      prefect_server:
        condition: service_started
      qdrant:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 2.5G

  demo:
    image: ghcr.io/fransmm/syndra-demo:${DEMO_TAG:-latest}
    container_name: syndra_demo
    logging: *default-logging
    # No host ports: Caddy is the only ingress, same as the API.
    networks:
      - syndra_net
    restart: unless-stopped
    volumes:
      # Read-only so the container can read the demo key but never rewrite its
      # own configuration. The file is 0600 and owned by uid 1000 on the host,
      # which is why the image runs as uid 1000 too.
      - ./streamlit-secrets.toml:/app/.streamlit/secrets.toml:ro
    deploy:
      resources:
        limits:
          # This is the only unauthenticated, public entry point on the box.
          # A hard cap means a runaway demo is killed by its own cgroup instead
          # of taking the API down with it. Streamlit with pandas/plotly and no
          # torch sits around 200M.
          memory: 384M
    # Deliberately NOT depending on api: the demo must still serve its page and
    # explain itself if the API is down, rather than refusing to start.

  caddy:
    image: caddy:2-alpine
    container_name: syndra_caddy
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - syndra_caddy_data:/data
      - syndra_caddy_config:/config
    networks:
      - syndra_net
    restart: unless-stopped
    depends_on:
      - api

networks:
  syndra_net:
    driver: bridge

volumes:
  syndra_pgdata:
  syndra_qdrant_data:
  syndra_redis_data:
  syndra_caddy_data:
  syndra_caddy_config:
