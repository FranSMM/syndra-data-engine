services:
  postgres:
    image: postgres:15-alpine
    container_name: syndra_postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - syndra_pgdata:/var/lib/postgresql/data
    networks:
      - syndra_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.17.0
    container_name: syndra_qdrant
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - syndra_qdrant_data:/qdrant/storage
    networks:
      - syndra_net
    restart: unless-stopped

  api:
    image: ghcr.io/fransmm/syndra-etl:latest 
    container_name: syndra_api
    ports:
      - "127.0.0.1:8000:8000" 
    env_file: ../.env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    networks:
      - syndra_net
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  scheduler:
    image: ghcr.io/fransmm/syndra-etl:latest 
    container_name: syndra_scheduler
    env_file: ../.env
    command: ["python", "-m", "app.pipeline"]
    networks:
      - syndra_net
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2.5G

networks:
  syndra_net:
    driver: bridge

volumes:
  syndra_pgdata:
  syndra_qdrant_data:
